name: Fedora packages

on:
  push:
    branches: [master]
    tags: ["v*"]
    paths-ignore:
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: Fedora ${{ matrix.fedora }}
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:${{ matrix.fedora }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        fedora: [44, 45]
    steps:
      - name: Install build tools
        run: dnf install -y --setopt=install_weak_deps=False gcc git-core rpm-build desktop-file-utils findutils
      - uses: actions/checkout@v5
      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@v2
        with:
          key: fedora-${{ matrix.fedora }}
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Build
        run: cargo build --release --locked -p oxmacs -p ox-cli
      - name: Version
        id: version
        run: |
          base=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${base}^$(date -u +%Y%m%d%H%M)git${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi
      - name: Package
        run: |
          desktop-file-validate packaging/linux/io.github.collide2954.oxmacs.desktop
          rpmbuild -bb packaging/fedora/oxmacs.spec \
            --define "_topdir $PWD/rpmbuild" \
            --define "oxmacs_version ${{ steps.version.outputs.version }}" \
            --define "oxmacs_source $PWD"
      - name: Install and run
        run: |
          dnf install -y rpmbuild/RPMS/*/*.rpm
          printf '(println (+ 1 2))\n' > /tmp/smoke.ox
          test "$(ox /tmp/smoke.ox)" = 3
          test -x /usr/bin/oxmacs
      - uses: actions/upload-artifact@v4
        with:
          name: rpm-fedora-${{ matrix.fedora }}
          path: rpmbuild/RPMS/*/*.rpm
          if-no-files-found: error

  publish:
    name: Publish
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:latest
    timeout-minutes: 20
    concurrency:
      group: rpm-publish
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Install tools
        run: dnf install -y --setopt=install_weak_deps=False createrepo_c git-core rpm gh
      - uses: actions/checkout@v5
        with:
          path: source
      - uses: actions/download-artifact@v4
        with:
          pattern: rpm-fedora-*
          path: built
      - name: Update the repository on GitHub Pages
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          channel=nightly
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then channel=stable; fi
          remote="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git clone --depth 1 --branch gh-pages "$remote" site; then
            :
          else
            git init -q -b gh-pages site
            git -C site remote add origin "$remote"
          fi
          owner="${GITHUB_REPOSITORY%%/*}"
          name="${GITHUB_REPOSITORY#*/}"
          bash source/packaging/fedora/publish.sh "$channel" built site "https://${owner,,}.github.io/${name}"
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish ${channel} RPMs for ${GITHUB_SHA::7}"
          git push -q origin gh-pages
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes "See CHANGELOG.md."
          find built -name '*.rpm' -print0 \
            | xargs -0 gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber
