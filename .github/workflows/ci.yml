name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
    paths-ignore:
      - "**.md"
  pull_request:
    paths-ignore:
      - "**.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          components: rustfmt
      - run: cargo fmt --all --check

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny check

  notices:
    name: Third-party licenses
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      - run: cargo about generate --locked -c packaging/licenses/about.toml -o THIRD-PARTY-LICENSES.html packaging/licenses/about.hbs
      - uses: actions/upload-artifact@v4
        with:
          name: notices
          path: THIRD-PARTY-LICENSES.html
          if-no-files-found: error

  clippy:
    name: clippy (${{ matrix.name }})
    needs: fmt
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
          - name: macOS
            os: macos-latest
          - name: Windows
            os: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Ox format and check
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo run -q -p ox-cli --locked -- fmt --check crates/oxmacs-ox/plugins crates/oxmacs-ox/src crates/oxmacs-api/src crates/ox/src/library crates/ox-library/src crates/ox-perf/benchmarks
          cargo run -q -p ox-cli --locked -- check crates/oxmacs-ox/plugins

  check:
    name: ${{ matrix.name }}
    needs: [clippy, notices]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            executable: oxmacs-linux-x86_64
            exe: ""
            rustflags: ""
          - name: macOS
            os: macos-latest
            executable: oxmacs-macos-arm64
            exe: ""
            rustflags: ""
          - name: Windows
            os: windows-latest
            executable: oxmacs-windows-x86_64
            exe: .exe
            rustflags: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: notices
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Test
        run: cargo test --workspace --all-features --locked --no-fail-fast
      - name: Build the executables
        id: build
        if: ${{ !cancelled() }}
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: cargo build --release --locked -p oxmacs -p ox-cli
      - name: Package the executables
        id: package
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          folder="dist/${{ matrix.executable }}"
          mkdir -p "$folder"
          cp "target/release/oxmacs${{ matrix.exe }}" "target/release/ox${{ matrix.exe }}" "$folder/"
          cp LICENSE-APACHE README.md CHANGELOG.md THIRD-PARTY-LICENSES.html crates/oxmacs-gui/fonts/JetBrainsMono-OFL.txt "$folder/"
          cp crates/oxmacs-core/queries/NOTICE.md "$folder/QUERIES-NOTICE.md"
          printf '(println (+ 1 2))\n' > smoke.ox
          test "$("$folder/ox${{ matrix.exe }}" smoke.ox | tr -d '\r')" = 3
          test -x "$folder/oxmacs${{ matrix.exe }}"
          if [[ "${{ runner.os }}" != Windows ]]; then
            "$folder/oxmacs" --version | grep -q '^oxmacs '
            tar -C dist -czf "dist/${{ matrix.executable }}.tar.gz" "${{ matrix.executable }}"
            rm -r "$folder"
          fi
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        with:
          name: ${{ matrix.executable }}
          path: dist
          if-no-files-found: error

  fedora:
    name: Fedora ${{ matrix.fedora }}
    needs: [clippy, notices]
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:${{ matrix.fedora }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        fedora: [44, 45]
    steps:
      - name: Install build tools
        run: dnf install -y --setopt=install_weak_deps=False gcc git-core rpm-build desktop-file-utils findutils
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: notices
      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@v2
        with:
          key: fedora-${{ matrix.fedora }}
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Build
        run: cargo build --release --locked -p oxmacs -p ox-cli
      - name: Version
        id: version
        run: |
          base=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            stamp=$(TZ=UTC git -c safe.directory="$PWD" log -1 --format=%cd --date=format-local:%Y%m%d%H%M)
            echo "version=${base}^${stamp}git${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi
      - name: Package
        run: |
          desktop-file-validate packaging/linux/io.github.collide2954.oxmacs.desktop
          rpmbuild -bb packaging/fedora/oxmacs.spec \
            --define "_topdir $PWD/rpmbuild" \
            --define "oxmacs_version ${{ steps.version.outputs.version }}" \
            --define "oxmacs_source $PWD"
      - name: Install and run
        run: |
          dnf install -y rpmbuild/RPMS/*/*.rpm
          printf '(println (+ 1 2))\n' > /tmp/smoke.ox
          test "$(ox /tmp/smoke.ox)" = 3
          oxmacs --version | grep -q '^oxmacs '
      - uses: actions/upload-artifact@v4
        with:
          name: rpm-fedora-${{ matrix.fedora }}
          path: rpmbuild/RPMS/*/*.rpm
          if-no-files-found: error

  publish:
    name: Publish
    needs: [check, fedora]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:latest
    timeout-minutes: 20
    concurrency:
      group: rpm-publish
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Install tools
        run: dnf install -y --setopt=install_weak_deps=False createrepo_c git-core rpm gh zip findutils
      - uses: actions/checkout@v5
        with:
          path: source
      - uses: actions/download-artifact@v4
        with:
          pattern: rpm-fedora-*
          path: built
      - name: Update the repository on GitHub Pages
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          channel=nightly
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then channel=stable; fi
          remote="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git clone --depth 1 --branch gh-pages "$remote" site; then
            :
          else
            git init -q -b gh-pages site
            git -C site remote add origin "$remote"
          fi
          owner="${GITHUB_REPOSITORY%%/*}"
          name="${GITHUB_REPOSITORY#*/}"
          bash source/packaging/fedora/publish.sh "$channel" built site "https://${owner,,}.github.io/${name}"
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q --orphan published
          git add -A
          git commit -q -m "Publish ${channel} RPMs for ${GITHUB_SHA::7}"
          git push -q --force origin published:gh-pages
      - uses: actions/download-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          pattern: oxmacs-*
          path: executables
          merge-multiple: true
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd executables
          for folder in */; do
            zip -qr "${folder%/}.zip" "$folder"
          done
          cd ..
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes "See CHANGELOG.md."
          find built executables -maxdepth 3 \( -name '*.rpm' -o -name '*.tar.gz' -o -name '*.zip' \) -print0 \
            | xargs -0 gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber
