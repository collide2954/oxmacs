[workspace]
members = ["crates/*"]
default-members = [
    "crates/ox",
    "crates/ox-cli",
    "crates/ox-perf",
    "crates/oxmacs",
    "crates/oxmacs-core",
    "crates/oxmacs-gui",
    "crates/oxmacs-ox",
]
resolver = "3"

[workspace.package]
version = "0.13.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
bitflags = "2.13.2"
dirs = "7.0.0"
iced = { version = "0.14.0", features = ["advanced", "canvas", "image"] }
iced_test = "0.14.0"
indexmap = "2.14.2"
jiff = "0.2.38"
ox = { path = "crates/ox" }
ox-perf = { path = "crates/ox-perf" }
oxmacs-core = { path = "crates/oxmacs-core" }
oxmacs-gui = { path = "crates/oxmacs-gui" }
oxmacs-ox = { path = "crates/oxmacs-ox" }
native-theme = { version = "0.6.1", default-features = false }
notify = "8.2.0"
num-bigint = "0.4.8"
num-traits = "0.2.19"
open = "5.4.4"
regex = "1.13.1"
ring = "0.17.14"
ropey = { version = "1.6.1", default-features = false, features = ["simd"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
skrifa = "0.48.0"
streaming-iterator = "0.1.9"
strum = { version = "0.28.0", features = ["derive"] }
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
toml = "1.1.8"
toml_edit = "0.25.17"
trash = { version = "5.2.9", default-features = false, features = ["coinit_apartmentthreaded"] }
tree-sitter = "0.27.1"
tree-sitter-r = "1.3.0"
tree-sitter-rust = "0.24.2"
tree-sitter-toml-ng = "0.7.0"
unicode-width = "0.2.2"
ureq = "3.4.2"
webpki-roots = "1.0.9"
windows-sys = "0.61.2"

[workspace.lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }
missing_debug_implementations = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.release]
codegen-units = 1
lto = "fat"

[profile.profiling]
inherits = "release"
debug = "limited"
