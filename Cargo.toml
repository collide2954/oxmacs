[workspace]
members = ["crates/*"]
default-members = [
    "crates/ox",
    "crates/ox-cli",
    "crates/ox-library",
    "crates/ox-lsp",
    "crates/ox-perf",
    "crates/oxmacs",
    "crates/oxmacs-api",
    "crates/oxmacs-core",
    "crates/oxmacs-gui",
    "crates/oxmacs-ox",
    "crates/rodeo",
]
resolver = "3"

[workspace.package]
version = "0.14.0"
edition = "2024"
rust-version = "1.99.1"
publish = false
license = "Apache-2.0"

[workspace.dependencies]
argon2 = { version = "0.6.0", default-features = false, features = ["alloc"] }
base64 = "0.23.1"
bitflags = "2.13.2"
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc"] }
dirs = "7.0.0"
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }
getrandom = "0.4.3"
iced = { version = "0.14.0", features = ["advanced", "canvas", "image-without-codecs"] }
iced_runtime = "0.14.0"
iced_test = "0.14.0"
image = { version = "0.25.10", default-features = false, features = ["bmp", "gif", "ico", "jpeg", "png", "qoi", "tiff", "webp"] }
imageproc = { version = "0.27.0", default-features = false, features = ["rayon"] }
indexmap = "2.14.2"
jiff = "0.2.38"
keepass = "0.17.0"
lsp-server = "0.10.0"
ox = { path = "crates/ox" }
ox-library = { path = "crates/ox-library" }
ox-lsp = { path = "crates/ox-lsp" }
ox-perf = { path = "crates/ox-perf" }
oxmacs-core = { path = "crates/oxmacs-core" }
oxmacs-gui = { path = "crates/oxmacs-gui" }
oxmacs-api = { path = "crates/oxmacs-api" }
oxmacs-ox = { path = "crates/oxmacs-ox" }
native-theme = { version = "0.6.1", default-features = false }
notify = "8.2.0"
num-bigint = "0.5.1"
num-traits = "0.2.19"
open = "5.4.4"
rayon = "1.12.0"
regex = "1.13.1"
rodeo = { path = "crates/rodeo" }
resvg = { version = "0.49.0", default-features = false, features = ["text", "system-fonts"] }
ring = "0.17.14"
ropey = { version = "1.6.1", default-features = false, features = ["simd"] }
roxmltree = "0.21.1"
zip = { version = "9.0.4", default-features = false, features = ["deflate-flate2-zlib-rs"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
semver = "1.0.28"
serde_json = "1.0.154"
skrifa = "0.49.0"
streaming-iterator = "0.1.9"
strum = { version = "0.28.0", features = ["derive"] }
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
tiny-skia = "0.12.0"
trash = { version = "5.2.9", default-features = false, features = ["coinit_apartmentthreaded"] }
tree-sitter = "0.27.1"
tree-sitter-r = "1.3.0"
tree-sitter-rust = "0.24.2"
tree-sitter-toml-ng = "0.7.0"
unicode-width = "0.2.2"
ureq = "3.4.2"
webpki-roots = "1.0.9"
winapi-util = "0.1.11"
windows-sys = "0.61.2"

[workspace.lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }
missing_debug_implementations = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.release]
codegen-units = 1
lto = "fat"

[profile.profiling]
inherits = "release"
debug = "limited"

[profile.speed]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
