[package]
name = "oxmacs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = ["markdown", "weather"]
animated-splash = ["dep:oxmacs-splash"]
atlas = ["dep:oxmacs-atlas"]
demo = ["dep:oxmacs-demo"]
extra-themes = ["dep:oxmacs-themes"]
irc = ["dep:oxmacs-irc"]
markdown = ["dep:oxmacs-markdown"]
weather = ["dep:oxmacs-weather"]

[dependencies]
oxmacs-atlas = { workspace = true, optional = true }
oxmacs-core.workspace = true
oxmacs-demo = { workspace = true, optional = true }
oxmacs-gui.workspace = true
oxmacs-irc = { workspace = true, optional = true }
oxmacs-markdown = { workspace = true, optional = true }
oxmacs-splash = { workspace = true, optional = true }
oxmacs-themes = { workspace = true, optional = true }
oxmacs-weather = { workspace = true, optional = true }
