[package]
name = "oxmacs-script"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
autotests = false

[lints]
workspace = true

[dependencies]
dirs.workspace = true
jiff.workspace = true
keepass.workspace = true
ox-lang.workspace = true
ox-library.workspace = true
ox-rodeo.workspace = true
ox-synth.workspace = true
oxmacs-api.workspace = true
oxmacs-core.workspace = true
oxmacs-pdf.workspace = true
regex.workspace = true
rodio.workspace = true
semver.workspace = true
serde_json.workspace = true
tempfile = { workspace = true, optional = true }
thiserror.workspace = true
zip = { workspace = true, optional = true }

[features]
testing = ["dep:tempfile", "dep:zip", "oxmacs-core/testing"]

[dev-dependencies]
image.workspace = true
keepass = { workspace = true, features = ["save_kdbx4"] }
oxmacs-core = { workspace = true, features = ["testing"] }
tempfile.workspace = true
zip.workspace = true

[[test]]
name = "integration"
path = "tests/main.rs"
required-features = ["testing"]
